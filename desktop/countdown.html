<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:"><title>Quiet AI</title><link rel="stylesheet" href="countdown.css"></head>
<body>
  <main class="card" role="alertdialog" aria-labelledby="title" aria-describedby="hint">

    <div class="text">
      <h1 id="title"><span id="what">Sleeping</span> in <span id="left" class="left">0:30</span></h1>
      <p id="hint">Your AI has finished. Move the mouse or press Cancel to stay awake.</p>

    <button id="cancel">Cancel</button>
    <div class="bar"><span id="fill"></span></div>
  </main>
  <script src="countdown.js"></script>
</body></html>
