name: Feature request
description: Suggest an idea for Quiet AI
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Quiet AI to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: When would it help?
      description: Describe the situation. For example, "I run Codex overnight on a laptop and…"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead?
