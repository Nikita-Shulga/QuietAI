name: Quiet AI desktop packages
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: win-x64
          - os: windows-latest
            target: win-arm64
          - os: macos-latest
            target: mac-arm64
          - os: macos-latest
            target: mac-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Package desktop app
        run: python scripts/build.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: QuietAI-${{ matrix.target }}
          path: .artifacts/releases/*.zip
          if-no-files-found: error

  # A tag such as v4.2.0 publishes a GitHub Release. Installed copies of Quiet AI read the
  # latest release, so the four ZIP names and SHA256SUMS.txt must stay as they are.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(python3 -c "import json;print(json.load(open('desktop/package.json'))['version'])")
          build=$(python3 -c "import re;print(re.search(r\"VERSION='([^']+)'\",open('scripts/build.py').read())[1])")
          if [ "$tag" != "$app" ] || [ "$tag" != "$build" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match desktop/package.json ($app) and scripts/build.py ($build)."; exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          pattern: QuietAI-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="## Quiet AI ${GITHUB_REF_NAME#v}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --title "Quiet AI ${GITHUB_REF_NAME#v}" --notes "${notes:-See CHANGELOG.md}"
